{% extends 'base.html' %}{% block content %}
<h2>New ticket</h2>
<form method='post' action='/tickets' enctype='multipart/form-data'>
  <p><input name='title' placeholder='Short summary' required size='60'></p>
  <p><textarea name='description' rows='5' cols='60' placeholder='Describe the issue' required></textarea></p>
  <p>Priority <select name='priority'><option>Low</option><option selected>Medium</option><option>High</option></select></p>
  <p>Attachment <input type='file' name='file' accept='.png,.jpg,.jpeg,.pdf,.txt,.log'></p>
  <button>Create ticket</button>
</form>{% endblock %}
